# This file specifies the build dependencies for Github Action workflows and
# for local build environments. The workspace has four toplevel directories
# containing the user config, modules, zephyr and ZMK.
#
# ZMK-Workspace
# ├── config
# ├── modules
# ├── zephyr
# └── zmk
#
# To create a local build environment, clone this repository and then run the
# following commands from its toplevel directory:
#
# $ west init -l config
# $ west update
# $ west zephyr-export
#
# NOTE: this points at MoErgo's own ZMK fork (not mainline zmkfirmware/zmk),
# matching exactly what MoErgo's official glove80-zmk-config-west template
# uses. This is required for the Glove80's bootloader/partition layout to
# match the firmware - building against mainline ZMK produces firmware that
# compiles fine but fails to boot on real hardware.
---
manifest:
  remotes:
    - name: moergo-sc
      url-base: https://github.com/moergo-sc

  projects:
    - name: zmk
      remote: moergo-sc
      revision: main
      import: app/west.yml

  self:
    path: config
